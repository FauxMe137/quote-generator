<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quote Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Quote of the Day</h2>
        <blockquote id="quote">Loading...</blockquote>
        <span id="author">Loading...</span>
        <div>
            <button onclick="getQuote(apiUrl)">New Quote</button>
            <button onclick="shareOnX()"><img src="X.jpg" alt="">Tweet</button>
        </div>
    </div>
    <script>
        const quote = document.getElementById("quote");
        const author = document.getElementById("author");
        const apiUrl = "https://zenquotes.io/api/random"

        async function getQuote(url) {
            const response = await fetch(url);
            var data = await response.json();
            console.log(data);
            quote.textContent = data[0].q;
            author.textContent = data[0].a;
        }

        getQuote(apiUrl);

        function shareOnX() {
            const quotedText = quote.innerHTML;
            const website = "https://example.com";

            const xUrl =
      "https://twitter.com/intent/tweet?text=" +
      encodeURIComponent(quotedText) +
      "&url=" +
      encodeURIComponent(website);

    window.open(xUrl, "_blank");
  }
    </script>
</body>
</html>
